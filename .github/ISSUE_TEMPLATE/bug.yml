name: Bug Report
description: Defect, regression, or unexpected behavior
title: "[Bug]: "
labels:
  - type:bug
  - status:triage
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happens now?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, failing CI links, stack traces, or affected files.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      value: |
        - [ ] The bug is fixed.
        - [ ] A regression test or clear manual verification is provided.
    validations:
      required: true

  - type: textarea
    id: test-plan
    attributes:
      label: Test Plan
      value: |
        Unit:
        Integration:
        E2E/manual:
        Nx targets expected:
    validations:
      required: true
