version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - type:chore
      - area:infra
      - agent:human
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - type:chore
      - area:infra
      - agent:human
    open-pull-requests-limit: 5
