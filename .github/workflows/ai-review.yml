# .github/workflows/ai-review.yml
# Antigravity × GitHub PR Review Automation
# Ref: https://antigravitylab.net/en/articles/integrations/antigravity-github-pr-review-ai-automation
name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: bsaas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bsaas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
      NX_CLOUD_DISTRIBUTED_EXECUTION: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema libs/server/data-access/prisma/schema.prisma

      - name: Get changed files
        id: changed
        run: |
          FILES=$(gh pr diff ${{ github.event.pull_request.number }} --name-only)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run affected lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          NX_EXIT=0
          npx nx affected -t lint --base=origin/${{ github.base_ref }} --head=HEAD --output-style=stream 2>&1 | tee lint-results.txt || NX_EXIT=$?
          LINT_ERRORS=$(grep -c "error" lint-results.txt || true)
          echo "count=${LINT_ERRORS:-0}" >> $GITHUB_OUTPUT
          echo "exit_code=$NX_EXIT" >> $GITHUB_OUTPUT
          exit 0

      - name: Run affected type check
        id: typecheck
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          NX_EXIT=0
          npx nx affected -t type-check --base=origin/${{ github.base_ref }} --head=HEAD --output-style=stream 2>&1 | tee type-errors.txt || NX_EXIT=$?
          TYPE_ERRORS=$(grep -c "error TS" type-errors.txt || true)
          echo "count=${TYPE_ERRORS:-0}" >> $GITHUB_OUTPUT
          echo "exit_code=$NX_EXIT" >> $GITHUB_OUTPUT
          exit 0

      - name: Run affected tests
        id: tests
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          NX_EXIT=0
          npx nx affected -t test --base=origin/${{ github.base_ref }} --head=HEAD --output-style=stream --passWithNoTests 2>&1 | tee test-results.txt || NX_EXIT=$?
          FAILED=$(grep -c "FAIL\|failed" test-results.txt || true)
          echo "failed=${FAILED:-0}" >> $GITHUB_OUTPUT
          echo "exit_code=$NX_EXIT" >> $GITHUB_OUTPUT
          exit 0

      - name: Post review summary
        if: always()
        run: |
          LINT_ERRORS="${{ steps.lint.outputs.count || '0' }}"
          LINT_EXIT="${{ steps.lint.outputs.exit_code || '0' }}"
          TYPE_ERRORS="${{ steps.typecheck.outputs.count || '0' }}"
          TYPE_EXIT="${{ steps.typecheck.outputs.exit_code || '0' }}"
          TEST_FAILURES="${{ steps.tests.outputs.failed || '0' }}"
          TEST_EXIT="${{ steps.tests.outputs.exit_code || '0' }}"

          HAS_FAILURE=false
          if [ "$LINT_ERRORS" -gt 0 ] || [ "$LINT_EXIT" -ne 0 ] || [ "$TYPE_ERRORS" -gt 0 ] || [ "$TYPE_EXIT" -ne 0 ] || [ "$TEST_FAILURES" -gt 0 ] || [ "$TEST_EXIT" -ne 0 ]; then
            HAS_FAILURE=true
            VERDICT="Issues Detected"
            STATUS_ICON="RED"
          else
            VERDICT="LGTM"
            STATUS_ICON="GREEN"
          fi

          BODY="## Antigravity AI Code Review\n\n"
          BODY+="**Verdict**: ${STATUS_ICON} ${VERDICT}\n\n"
          BODY+="| Check | Result |\n"
          BODY+="|---|---|\n"
          BODY+="| Lint | errors=${LINT_ERRORS}, exit=${LINT_EXIT} |\n"
          BODY+="| Type Check | errors=${TYPE_ERRORS}, exit=${TYPE_EXIT} |\n"
          BODY+="| Tests | failures=${TEST_FAILURES}, exit=${TEST_EXIT} |\n"
          BODY+="\n"

          if [ "$HAS_FAILURE" = "true" ]; then
            BODY+="Automated checks found issues. See the Actions run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            BODY+="All automated checks passed. Ready for human review."
          fi

          gh pr comment ${{ github.event.pull_request.number }} --body "$(echo -e "$BODY")"

          if [ "$HAS_FAILURE" = "true" ]; then
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
