name: OpenAPI Contract

on:
  pull_request:
    paths:
      - 'docs/specs/auth/API/**'
      - 'libs/server/features/auth/**'
      - 'apps/api/**'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install deps
        run: |
          npm ci --ignore-scripts --no-audit --fund=false
          node scripts/check-versions/node-version.js

      - name: Lint OpenAPI (Redocly)
        run: npm run openapi:lint:auth

      - name: Route parity check (controllers vs spec)
        run: npm run openapi:check:auth
