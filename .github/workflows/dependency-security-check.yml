name: Dependency Security Check

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to scan'
        required: true
        default: 'main'
      audit_level:
        description: 'Minimum vulnerability severity that fails the workflow'
        required: true
        type: choice
        options:
          - low
          - moderate
          - high
          - critical
        default: high

permissions:
  contents: read

jobs:
  npm-audit:
    name: NPM audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Audit all dependencies
        run: npm audit --audit-level="${{ inputs.audit_level }}"
