name: Dependency Security Check

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch, tag, or commit SHA to scan'
        required: true
        default: 'main'
      fail_on_vuln:
        description: 'Fail the workflow when OSV finds vulnerabilities'
        required: true
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'

permissions:
  actions: read
  contents: read

jobs:
  osv-scan:
    name: OSV full vulnerability scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    permissions:
      actions: read
      contents: read
    with:
      ref: ${{ inputs.target_branch }}
      upload-sarif: false
      fail-on-vuln: ${{ inputs.fail_on_vuln == 'true' }}
      scan-args: |-
        --recursive
        ./
