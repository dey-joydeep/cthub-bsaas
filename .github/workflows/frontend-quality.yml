name: Frontend Quality Checks

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'libs/web/**'
      - 'libs/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'nx.json'
      - 'tsconfig.base.json'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'libs/web/**'
      - 'libs/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'nx.json'
      - 'tsconfig.base.json'
  schedule:
    - cron: '0 0 * * 1' # Weekly on Monday

env:
  NODE_VERSION: '20'
  COVERAGE_THRESHOLD: 80

jobs:
  quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set Nx affected refs
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "NX_BASE=origin/${{ github.base_ref }}" >> "$GITHUB_ENV"
            echo "NX_HEAD=HEAD" >> "$GITHUB_ENV"
            echo "NX_DAEMON=false" >> "$GITHUB_ENV"
            echo "NX_NO_CLOUD=true" >> "$GITHUB_ENV"
          else
            echo "NX_BASE=${{ github.event.before }}" >> "$GITHUB_ENV"
            echo "NX_HEAD=HEAD" >> "$GITHUB_ENV"
          fi

      - name: Run quality checks
        shell: bash
        run: |
          SOURCE_IMPACTING_CHANGES="$(git diff --name-only "$NX_BASE" "$NX_HEAD" | grep -E '^(apps/web/.*/src/|libs/web/.*/src/|libs/shared/src/|package.json$|package-lock.json$|nx.json$|tsconfig.base.json$)' || true)"

          if [ -z "$SOURCE_IMPACTING_CHANGES" ]; then
            echo "No source-impacting frontend changes detected. Skipping frontend lint/test."
            exit 0
          fi

          echo "Source-impacting frontend changes:"
          echo "$SOURCE_IMPACTING_CHANGES"

          filter_frontend_projects() {
            # Keep this workflow scoped to web apps/libs/shared. E2E projects are
            # validated by E2E-specific checks and should not be pulled in by
            # the broad web-* project-name prefix.
            grep -E '^(web-.*|shared)$' | grep -Ev -- '-e2e$' || true
          }

          FRONTEND_LINT_PROJECTS="$(npx nx show projects --affected --base="$NX_BASE" --head="$NX_HEAD" --withTarget=lint | filter_frontend_projects | paste -sd, -)"
          FRONTEND_TEST_PROJECTS="$(npx nx show projects --affected --base="$NX_BASE" --head="$NX_HEAD" --withTarget=test | filter_frontend_projects | paste -sd, -)"

          if [ -n "$FRONTEND_LINT_PROJECTS" ]; then
            npx nx run-many --target=lint --projects="$FRONTEND_LINT_PROJECTS" --parallel=3
          else
            echo "No affected frontend projects with lint target."
          fi

          if [ -n "$FRONTEND_TEST_PROJECTS" ]; then
            npx nx run-many --target=test --projects="$FRONTEND_TEST_PROJECTS" --parallel=3
          else
            echo "No affected frontend projects with test target."
          fi
        env:
          CI: true

      - name: Generate quality report
        run: echo "Quality report generation is not configured yet."

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            reports/quality/
          retention-days: 7

      - name: Check coverage threshold
        if: always()
        run: |
          if [ -f "coverage/coverage-summary.json" ]; then
            COVERAGE=$(grep -oP '(?<="total":{"lines":{"pct":)[0-9.]+' coverage/coverage-summary.json)
            if (( $(echo "$COVERAGE < ${{ env.COVERAGE_THRESHOLD }}" | bc -l) )); then
              echo "Coverage ($COVERAGE%) is below threshold (${{ env.COVERAGE_THRESHOLD }}%)"
              exit 1
            else
              echo "Coverage ($COVERAGE%) meets threshold (${{ env.COVERAGE_THRESHOLD }}%)"
            fi
          else
            echo "No coverage report found"
          fi
