name: SonarQube Analysis

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to analyze (leave empty to analyze current branch)'
        required: false
        default: ''

env:
  NODE_VERSION: '24'

jobs:
  sonar:
    name: SonarQube Scan (Self-Hosted)
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      # The `secrets` context is not available in job-level `if`, so fail fast here instead.
      - name: Verify SONAR_TOKEN is configured
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:SONAR_TOKEN)) {
            Write-Error 'SONAR_TOKEN repository secret is not configured.'
            exit 1
          }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch || github.ref }}
          fetch-depth: 0 # Full history required by SonarQube blame analysis
          set-safe-directory: false
          clean: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          if (Test-Path node_modules) {
            npm install --prefer-offline --no-audit
          } else {
            npm ci --prefer-offline --no-audit
          }

      - name: Generate Prisma client
        run: npx prisma generate --schema libs/server/data-access/prisma/schema.prisma

      - name: Run tests with coverage
        run: npx nx run-many -t test -p server-core,server-data-access,server-feature-auth,server-feature-salon-owner --coverage --parallel=2

      - name: Run SonarQube Scan
        run: npm run sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || vars.SONAR_HOST_URL || 'http://localhost:9000' }}
