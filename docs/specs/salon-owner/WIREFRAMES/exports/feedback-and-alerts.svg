<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 880" width="1120" height="880" style="background:#f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Header -->
  <text x="40" y="50" font-size="22" font-weight="700" fill="#0f172a">Design System: Feedback &amp; Alert State Patterns</text>
  <text x="40" y="78" font-size="13" fill="#64748b">Standard visual schema for banners, toasts, inline validation, and modal conflicts across Salon Partner screens</text>
  <line x1="40" y1="96" x2="1080" y2="96" stroke="#e2e8f0" stroke-width="1" />

  <!-- Column 1: Page Banners -->
  <text x="40" y="130" font-size="15" font-weight="600" fill="#1e293b">1. Page &amp; Card Banners (Pinned Below Header)</text>
  <text x="40" y="150" font-size="11" fill="#64748b">Layout: Pinned under header, pushes grid down • Persistent until navigation or edit</text>

  <!-- 1.1 Success Banner -->
  <g transform="translate(40, 164)">
    <rect width="500" height="46" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="16" y="28" font-size="13" font-weight="600" fill="#166534">✓  Staff profile saved.</text>
    <text x="0" y="60" font-size="10" fill="#64748b">Class: .salon-banner-success | role="status" | OK confirmation</text>
  </g>

  <!-- 1.2 Error Banner -->
  <g transform="translate(40, 246)">
    <rect width="500" height="52" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="16" y="22" font-size="12" font-weight="600" fill="#991b1b">⚠  Cannot deactivate or remove Owner role from sole active owner.</text>
    <text x="36" y="40" font-size="11" fill="#991b1b">BR-ST-11 sole active owner protection triggered (HTTP 409).</text>
    <text x="0" y="68" font-size="10" fill="#64748b">Class: .salon-banner-error | role="alert" | Blocking domain conflict</text>
  </g>

  <!-- 1.3 Warning Banner -->
  <g transform="translate(40, 336)">
    <rect width="500" height="46" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="16" y="28" font-size="13" font-weight="600" fill="#b45309">⚠  Unsaved changes in Weekly Schedule will be lost.</text>
    <text x="0" y="60" font-size="10" fill="#64748b">Class: .salon-banner-warning | role="alert" | Cautionary non-blocking alert</text>
  </g>

  <!-- 1.4 Info Banner -->
  <g transform="translate(40, 418)">
    <rect width="500" height="46" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="16" y="28" font-size="13" font-weight="600" fill="#1e40af">ℹ  Multi-branch sync active for Tokyo Ginza and Shibuya flagship.</text>
    <text x="0" y="60" font-size="10" fill="#64748b">Class: .salon-banner-info | role="status" | Contextual guidance note</text>
  </g>

  <!-- Column 2: Toast, Inline & Modal -->
  <!-- 2.1 Floating Toast / Snackbar -->
  <text x="580" y="130" font-size="15" font-weight="600" fill="#1e293b">2. Floating Toast / Snackbar (MatSnackBar)</text>
  <text x="580" y="150" font-size="11" fill="#64748b">Layout: Floating bottom-right overlay (z-index 1000) • Auto-dismiss: 3–5 seconds</text>
  <g transform="translate(580, 164)">
    <rect width="500" height="50" rx="8" fill="#0f172a" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.15))"/>
    <text x="20" y="30" font-size="13" fill="#f8fafc">Appointment confirmed successfully.</text>
    <text x="430" y="30" font-size="12" font-weight="700" fill="#38bdf8">CLOSE</text>
    <text x="0" y="66" font-size="10" fill="#64748b">Usage: Background asynchronous confirmation (Appointments, Profile, Dashboard)</text>
  </g>

  <!-- 2.2 Inline Form Field Validation -->
  <text x="580" y="258" font-size="15" font-weight="600" fill="#1e293b">3. Inline Form Field Validation (&lt;mat-error&gt;)</text>
  <text x="580" y="278" font-size="11" fill="#64748b">Layout: Attached below individual inputs • Dynamic clear on valid input</text>
  <g transform="translate(580, 290)">
    <text x="0" y="14" font-size="11" font-weight="600" fill="#dc2626">Base Price (JPY) *</text>
    <rect y="22" width="500" height="42" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
    <text x="16" y="48" font-size="13" fill="#0f172a">-1500</text>
    <text x="0" y="80" font-size="11" fill="#dc2626">⚠ Price must be a valid positive amount greater than 0.</text>
    <text x="0" y="98" font-size="10" fill="#64748b">Usage: Synchronous client-side reactive form validation (duration, price, email, phone)</text>
  </g>

  <!-- 2.3 Blocking Conflict Modal -->
  <text x="580" y="420" font-size="15" font-weight="600" fill="#1e293b">4. Blocking Conflict Modal (MatDialog)</text>
  <text x="580" y="440" font-size="11" fill="#64748b">Layout: Centered modal with dimmed backdrop • Requires explicit user resolution</text>
  <g transform="translate(580, 456)">
    <rect width="500" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.08))"/>
    <text x="20" y="30" font-size="14" font-weight="700" fill="#0f172a">Schedule Conflict Detected</text>
    <text x="20" y="56" font-size="12" fill="#475569">2 upcoming appointments overlap with this modified shift.</text>
    <text x="20" y="74" font-size="12" fill="#475569">Please reassign affected bookings or select alternative slots.</text>
    <!-- Cancel button -->
    <rect x="290" y="102" width="80" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="312" y="123" font-size="12" font-weight="600" fill="#475569">Cancel</text>
    <!-- Action button -->
    <rect x="382" y="102" width="102" height="34" rx="6" fill="#2563eb"/>
    <text x="398" y="123" font-size="12" font-weight="600" fill="#ffffff">Resolve Slots</text>
  </g>

  <!-- Footer Traceability -->
  <line x1="40" y1="640" x2="1080" y2="640" stroke="#e2e8f0" stroke-width="1" />
  <text x="40" y="666" font-size="12" font-weight="600" fill="#1e293b">Specifications &amp; Architectural Traceability:</text>
  <text x="40" y="688" font-size="11" fill="#64748b">• Web LLD: docs/specs/salon-owner/WEB/web-lld.md (Section: Error And Empty States)</text>
  <text x="40" y="708" font-size="11" fill="#64748b">• Validation &amp; Messages: docs/specs/shared/error-message-catalog.md &amp; docs/specs/salon-owner/VALIDATION/staff-validation.md</text>
  <text x="40" y="728" font-size="11" fill="#64748b">• CSS Stylesheet Tokens: apps/web/partner/src/styles.css (.salon-banner-*)</text>
  <text x="40" y="748" font-size="11" fill="#64748b">• Penpot Board ID: 841325ba-74b2-8009-8008-e8d9430d39e3 (shared.feedback-and-alerts.desktop at x=3080, y=5000)</text>
</svg>
