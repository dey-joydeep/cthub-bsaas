<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design System: Feedback & Alert State Patterns</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #0f172a;
        color: #0f172a;
        padding: 32px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }
      .top-bar {
        width: 100%;
        max-width: 1120px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        color: #94a3b8;
        font-size: 14px;
      }
      .top-bar a {
        color: #38bdf8;
        text-decoration: none;
        font-weight: 500;
      }
      .top-bar a:hover {
        text-decoration: underline;
      }
      .board-container {
        background: #f8fafc;
        width: 100%;
        max-width: 1120px;
        border-radius: 12px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        overflow: hidden;
        border: 1px solid #334155;
      }
      img.board-svg {
        width: 100%;
        height: auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="top-bar">
      <div><strong>CTHub BSaaS</strong> • Salon Owner Design System Preview</div>
      <div>Penpot Board: <code>shared.feedback-and-alerts.desktop</code></div>
    </div>
    <div class="board-container">
      <img class="board-svg" src="./feedback-and-alerts.svg" alt="Design System: Feedback & Alert State Patterns" />
    </div>
  </body>
</html>
