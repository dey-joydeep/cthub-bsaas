openapi: 3.1.0
info:
  title: CTHub Salon Owner MVP API
  version: '1.0.0'
  description: |
    Target implementation contract for the Salon Owner MVP operational API.
    - All endpoints require authenticated partner/owner context unless stated otherwise.
    - Browser writes use platform CSRF protection.
    - Success responses use `{ success: true, data, meta }`.
    - Error responses use `{ success: false, code, message, details?, meta }`.
    - `meta.correlationId` is returned on success and error responses.
    - Money and decimal values are serialized as strings.
    - Timestamps are UTC ISO-8601 strings.
servers:
  - url: https://api.example.com
    description: Production
  - url: http://localhost:3000
    description: Local
tags:
  - name: Business Settings
  - name: Staff
  - name: Service Catalog
  - name: Customers
  - name: Appointments
  - name: POS
  - name: Inventory
  - name: Dashboard
security:
  - cookieAuth: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: bsaas_at
  parameters:
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Optional caller-provided correlation id. Server generates one when absent.
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Required by policy for payment capture, invoice finalization, appointment creation, and stock adjustments.
    RequiredIdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Required by policy for payment capture, invoice finalization, appointment creation, and stock adjustments.
    SupportReferenceHeader:
      name: X-Support-Reference
      in: header
      required: false
      schema:
        type: string
        minLength: 3
        maxLength: 160
      description: Required for platform-admin support mutations. Omit for owner-initiated mutations.
    SupportReasonHeader:
      name: X-Support-Reason
      in: header
      required: false
      schema:
        type: string
        minLength: 3
        maxLength: 500
      description: Required for platform-admin support mutations. Omit for owner-initiated mutations.
    BranchIdQuery:
      name: branchId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Uuid'
    BusinessIdQuery:
      name: businessId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Uuid'
    PageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeQuery:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    SearchQuery:
      name: q
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 100
    DateQuery:
      name: date
      in: query
      required: true
      schema:
        type: string
        format: date
  responses:
    BadRequest:
      description: Request is malformed or violates request-level constraints.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
    Forbidden:
      description: User lacks tenant, salon business, branch, or role permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
    NotFound:
      description: Resource is absent or outside caller scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
    Conflict:
      description: Domain conflict such as duplicate record or slot overlap.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
    ValidationError:
      description: Payload is syntactically valid but fails validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
  schemas:
    Uuid:
      type: string
      format: uuid
    IsoDateTime:
      type: string
      format: date-time
    MoneyAmount:
      type: string
      pattern: "^-?\\d+(\\.\\d{1,2})?$"
      examples: ['499.00']
    ApiMeta:
      type: object
      required: [correlationId]
      properties:
        correlationId:
          type: string
    PageMeta:
      type: object
      required: [correlationId, page, pageSize, total]
      properties:
        correlationId:
          type: string
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    ApiErrorEnvelope:
      type: object
      required: [success, code, message, meta]
      properties:
        success:
          type: boolean
          const: false
        code:
          type: string
          description: Stable shared message key.
        message:
          type: string
          description: Stable shared message key or localized fallback.
        details:
          type: object
          additionalProperties: true
        meta:
          $ref: '#/components/schemas/ApiMeta'
    SuccessEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          additionalProperties: true
        meta:
          $ref: '#/components/schemas/ApiMeta'
    PagedEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
                additionalProperties: true
        meta:
          $ref: '#/components/schemas/PageMeta'
    AddressDto:
      type: object
      required: [line1, city, state, postalCode, country]
      properties:
        line1:
          type: string
          maxLength: 160
        line2:
          type: string
          maxLength: 160
        city:
          type: string
          maxLength: 80
        state:
          type: string
          maxLength: 80
        postalCode:
          type: string
          maxLength: 20
        country:
          type: string
          minLength: 2
          maxLength: 2
          examples: ['IN']
    SalonBusinessInput:
      type: object
      required: [displayName, legalName, status]
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 120
        legalName:
          type: string
          minLength: 2
          maxLength: 160
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
    SalonBusinessDto:
      allOf:
        - $ref: '#/components/schemas/SalonBusinessInput'
        - type: object
          required: [id, tenantId, createdAt, updatedAt]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            tenantId:
              $ref: '#/components/schemas/Uuid'
            createdAt:
              $ref: '#/components/schemas/IsoDateTime'
            updatedAt:
              $ref: '#/components/schemas/IsoDateTime'
    SalonOwnerStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    BranchProfileInput:
      type: object
      required: [businessId, name, timezone, currency, status, address]
      properties:
        businessId:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          anyOf:
            - type: string
              maxLength: 30
            - type: 'null'
        email:
          anyOf:
            - type: string
              format: email
            - type: 'null'
        timezone:
          type: string
          examples: ['Asia/Kolkata']
        currency:
          type: string
          minLength: 3
          maxLength: 3
          examples: ['INR']
        status:
          $ref: '#/components/schemas/SalonOwnerStatus'
        address:
          $ref: '#/components/schemas/AddressDto'
    BranchDto:
      allOf:
        - $ref: '#/components/schemas/BranchProfileInput'
        - type: object
          required: [id, businessId, createdAt, updatedAt]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            businessId:
              $ref: '#/components/schemas/Uuid'
            createdAt:
              $ref: '#/components/schemas/IsoDateTime'
            updatedAt:
              $ref: '#/components/schemas/IsoDateTime'
    WeeklyHoursInput:
      type: object
      required: [timezone, days]
      properties:
        timezone:
          type: string
        acknowledgeExistingAppointmentsOutsideHours:
          type: boolean
          description: Required when future appointments would fall outside the proposed weekly hours.
        days:
          type: array
          minItems: 7
          maxItems: 7
          items:
            type: object
            required: [dayOfWeek, open, intervals]
            properties:
              dayOfWeek:
                type: integer
                minimum: 0
                maximum: 6
              open:
                type: boolean
              intervals:
                type: array
                items:
                  type: object
                  required: [start, end]
                  properties:
                    start:
                      type: string
                      pattern: "^\\d{2}:\\d{2}$"
                    end:
                      type: string
                      pattern: "^\\d{2}:\\d{2}$"
    BranchHolidayInput:
      type: object
      required: [closed]
      properties:
        closed:
          type: boolean
        reason:
          type: string
          maxLength: 160
        intervals:
          type: array
          items:
            type: object
            required: [start, end]
            properties:
              start:
                type: string
                pattern: "^\\d{2}:\\d{2}$"
              end:
                type: string
                pattern: "^\\d{2}:\\d{2}$"
    BranchPolicyInput:
      type: object
      required: [bookingLeadMinutes, cancellationCutoffMinutes, noShowGraceMinutes]
      properties:
        bookingLeadMinutes:
          type: integer
          minimum: 0
        cancellationCutoffMinutes:
          type: integer
          minimum: 0
        noShowGraceMinutes:
          type: integer
          minimum: 0
    StaffStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    StaffInput:
      type: object
      required: [branchIds, displayName, phone, status]
      properties:
        branchIds:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Uuid'
        displayName:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          maxLength: 30
        email:
          type: string
          format: email
        status:
          $ref: '#/components/schemas/StaffStatus'
    StaffDto:
      allOf:
        - $ref: '#/components/schemas/StaffInput'
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            roles:
              type: array
              items:
                type: string
            skillServiceIds:
              type: array
              items:
                $ref: '#/components/schemas/Uuid'
            createdAt:
              $ref: '#/components/schemas/IsoDateTime'
            updatedAt:
              $ref: '#/components/schemas/IsoDateTime'
    StaffRolesInput:
      type: object
      properties:
        roleIds:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Uuid'
          description: List of assigned BusinessRole IDs (ADR-0005).
        roles:
          type: array
          items:
            type: string
          description: Legacy string names or codes for backward compatibility.
    BusinessRole:
      type: object
      required: [id, businessId, name, permissions, isSystemDefault, isActive, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        businessId:
          $ref: '#/components/schemas/Uuid'
        roleCode:
          type: string
          nullable: true
          description: Preset code (e.g. OWNER, MANAGER) if seeded from RoleMaster.
        name:
          type: string
          description: Custom display name for this business.
        description:
          type: string
          nullable: true
          description: Explanation of what this role means and allows in this business.
        permissions:
          type: array
          items:
            type: string
          description: List of granted system permission capability codes.
        isSystemDefault:
          type: boolean
          description: True if seeded from platform RoleMaster template.
        isActive:
          type: boolean
          description: True if available for assignment to staff.
        createdAt:
          $ref: '#/components/schemas/IsoDateTime'
        updatedAt:
          $ref: '#/components/schemas/IsoDateTime'
    BusinessRoleInput:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 60
        description:
          type: string
          maxLength: 255
        permissions:
          type: array
          minItems: 1
          items:
            type: string
        isActive:
          type: boolean
          default: true
    PermissionItem:
      type: object
      required: [code, name, category, description]
      properties:
        code:
          type: string
          description: Unique capability code (e.g. appointment.create).
        name:
          type: string
          description: Human-readable permission name.
        category:
          type: string
          description: Domain category (e.g. Appointments, POS, Catalog, Staff).
        description:
          type: string
          description: Detailed permission scope and behavior.
    StaffSkillsInput:
      type: object
      required: [serviceIds]
      properties:
        serviceIds:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
    StaffShiftInput:
      type: object
      required: [branchId, timezone, days]
      properties:
        branchId:
          $ref: '#/components/schemas/Uuid'
        timezone:
          type: string
        days:
          type: array
          items:
            type: object
            required: [dayOfWeek, intervals]
            properties:
              dayOfWeek:
                type: integer
                minimum: 0
                maximum: 6
              intervals:
                type: array
                items:
                  type: object
                  required: [start, end]
                  properties:
                    start:
                      type: string
                      pattern: "^\\d{2}:\\d{2}$"
                    end:
                      type: string
                      pattern: "^\\d{2}:\\d{2}$"
    StaffLeaveBlockInput:
      type: object
      required: [branchId, startsAt, endsAt, reason]
      properties:
        branchId:
          $ref: '#/components/schemas/Uuid'
        startsAt:
          $ref: '#/components/schemas/IsoDateTime'
        endsAt:
          $ref: '#/components/schemas/IsoDateTime'
        reason:
          type: string
          maxLength: 160
    ServiceCategoryInput:
      type: object
      required: [name, sortOrder]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        sortOrder:
          type: integer
          minimum: 0
    ServiceCategoryDto:
      allOf:
        - $ref: '#/components/schemas/ServiceCategoryInput'
        - type: object
          required: [id]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
    ServiceStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    ServiceInput:
      type: object
      required: [categoryId, name, durationMinutes, basePrice, taxRatePercent, status]
      properties:
        categoryId:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          minLength: 2
          maxLength: 120
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 720
        bufferMinutes:
          type: integer
          minimum: 0
          default: 0
        basePrice:
          $ref: '#/components/schemas/MoneyAmount'
        taxRatePercent:
          type: string
          pattern: "^\\d+(\\.\\d{1,2})?$"
        status:
          $ref: '#/components/schemas/ServiceStatus'
    ServiceDto:
      allOf:
        - $ref: '#/components/schemas/ServiceInput'
        - type: object
          required: [id]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            eligibleStaffIds:
              type: array
              items:
                $ref: '#/components/schemas/Uuid'
    ServiceStatusInput:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/ServiceStatus'
    StaffEligibilityInput:
      type: object
      required: [staffIds]
      properties:
        staffIds:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
    CustomerInput:
      type: object
      required: [displayName, phone]
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          maxLength: 30
        email:
          type: string
          format: email
        dateOfBirth:
          type: string
          format: date
        consentForMarketing:
          type: boolean
          default: false
    CustomerDto:
      allOf:
        - $ref: '#/components/schemas/CustomerInput'
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            createdAt:
              $ref: '#/components/schemas/IsoDateTime'
            updatedAt:
              $ref: '#/components/schemas/IsoDateTime'
    CustomerNoteInput:
      type: object
      required: [body, visibility]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
        visibility:
          type: string
          enum: [INTERNAL, STAFF_VISIBLE]
    CommunicationPreferencesInput:
      type: object
      required: [smsEnabled, emailEnabled, whatsappEnabled]
      properties:
        smsEnabled:
          type: boolean
        emailEnabled:
          type: boolean
        whatsappEnabled:
          type: boolean
    AppointmentStatus:
      type: string
      enum: [BOOKED, CONFIRMED, ARRIVED, IN_SERVICE, COMPLETED, CANCELLED, NO_SHOW]
    AppointmentLineInput:
      type: object
      required: [serviceId, staffId, startsAt]
      properties:
        serviceId:
          $ref: '#/components/schemas/Uuid'
        staffId:
          $ref: '#/components/schemas/Uuid'
        startsAt:
          $ref: '#/components/schemas/IsoDateTime'
    AppointmentInput:
      type: object
      required: [branchId, customerId, lines]
      properties:
        branchId:
          $ref: '#/components/schemas/Uuid'
        customerId:
          $ref: '#/components/schemas/Uuid'
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AppointmentLineInput'
        notes:
          type: string
          maxLength: 1000
    WalkInAppointmentInput:
      allOf:
        - $ref: '#/components/schemas/AppointmentInput'
        - type: object
          properties:
            estimatedWaitMinutes:
              type: integer
              minimum: 0
    AppointmentDto:
      allOf:
        - $ref: '#/components/schemas/AppointmentInput'
        - type: object
          required: [id, status, createdAt, updatedAt]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            status:
              $ref: '#/components/schemas/AppointmentStatus'
            createdAt:
              $ref: '#/components/schemas/IsoDateTime'
            updatedAt:
              $ref: '#/components/schemas/IsoDateTime'
    RescheduleAppointmentInput:
      type: object
      required: [lines, reason]
      properties:
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AppointmentLineInput'
        reason:
          type: string
          minLength: 1
          maxLength: 240
    ReasonInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 240
    AvailableSlotDto:
      type: object
      required: [staffId, startsAt, endsAt]
      properties:
        staffId:
          $ref: '#/components/schemas/Uuid'
        startsAt:
          $ref: '#/components/schemas/IsoDateTime'
        endsAt:
          $ref: '#/components/schemas/IsoDateTime'
    InvoiceStatus:
      type: string
      enum: [DRAFT, FINALIZED, PARTIALLY_PAID, PAID, VOID]
    InvoiceInput:
      type: object
      required: [branchId, customerId, lines]
      properties:
        branchId:
          $ref: '#/components/schemas/Uuid'
        customerId:
          $ref: '#/components/schemas/Uuid'
        appointmentId:
          $ref: '#/components/schemas/Uuid'
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [type, referenceId, description, quantity, unitPrice]
            properties:
              type:
                type: string
                enum: [SERVICE, PRODUCT, ADJUSTMENT]
              referenceId:
                $ref: '#/components/schemas/Uuid'
              description:
                type: string
                maxLength: 160
              quantity:
                type: string
                pattern: "^\\d+(\\.\\d{1,3})?$"
              unitPrice:
                $ref: '#/components/schemas/MoneyAmount'
    InvoiceDto:
      allOf:
        - $ref: '#/components/schemas/InvoiceInput'
        - type: object
          required: [id, status, subtotal, taxTotal, discountTotal, total, paidAmount, dueAmount]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            status:
              $ref: '#/components/schemas/InvoiceStatus'
            subtotal:
              $ref: '#/components/schemas/MoneyAmount'
            taxTotal:
              $ref: '#/components/schemas/MoneyAmount'
            discountTotal:
              $ref: '#/components/schemas/MoneyAmount'
            total:
              $ref: '#/components/schemas/MoneyAmount'
            paidAmount:
              $ref: '#/components/schemas/MoneyAmount'
            dueAmount:
              $ref: '#/components/schemas/MoneyAmount'
    FinalizeInvoiceInput:
      type: object
      required: [confirmedTotal]
      properties:
        confirmedTotal:
          $ref: '#/components/schemas/MoneyAmount'
    PaymentInput:
      type: object
      required: [amount, method, receivedAt]
      properties:
        amount:
          $ref: '#/components/schemas/MoneyAmount'
        method:
          type: string
          enum: [CASH, CARD, UPI, WALLET, BANK_TRANSFER]
        receivedAt:
          $ref: '#/components/schemas/IsoDateTime'
        reference:
          type: string
          maxLength: 120
    ProductInput:
      type: object
      required: [name, sku, unit, retailPrice, status]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        sku:
          type: string
          minLength: 2
          maxLength: 80
        unit:
          type: string
          enum: [PIECE, ML, GRAM, PACK]
        retailPrice:
          $ref: '#/components/schemas/MoneyAmount'
        reorderPoint:
          type: string
          pattern: "^\\d+(\\.\\d{1,3})?$"
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
    ProductDto:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          required: [id]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
    StockMovementInput:
      type: object
      required: [branchId, productId, quantity, reason]
      properties:
        branchId:
          $ref: '#/components/schemas/Uuid'
        productId:
          $ref: '#/components/schemas/Uuid'
        quantity:
          type: string
          pattern: "^-?\\d+(\\.\\d{1,3})?$"
        reason:
          type: string
          enum: [PURCHASE, SALE, ADJUSTMENT, DAMAGE, RETURN]
        note:
          type: string
          maxLength: 240
    DashboardDto:
      type: object
      required: [businessDate, branchId, appointments, revenue, inventoryAlerts]
      properties:
        businessDate:
          type: string
          format: date
        branchId:
          $ref: '#/components/schemas/Uuid'
        appointments:
          type: object
          additionalProperties:
            type: integer
        revenue:
          type: object
          required: [gross, paid, due]
          properties:
            gross:
              $ref: '#/components/schemas/MoneyAmount'
            paid:
              $ref: '#/components/schemas/MoneyAmount'
            due:
              $ref: '#/components/schemas/MoneyAmount'
        inventoryAlerts:
          type: integer
          minimum: 0
paths:
  /partner/businesses:
    get:
      tags: [Business Settings]
      operationId: listSalonBusinesses
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/PageSizeQuery'
      responses:
        '200':
          description: Salon businesses available to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Business Settings]
      operationId: createSalonBusiness
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/RequiredIdempotencyKeyHeader'
        - $ref: '#/components/parameters/SupportReferenceHeader'
        - $ref: '#/components/parameters/SupportReasonHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalonBusinessInput'
      responses:
        '201':
