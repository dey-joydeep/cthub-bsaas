openapi: 3.1.0
info:
  title: CTHub Auth API
  version: "1.0.0"
  description: |
    Implementation-aligned Auth API.
    - Cookies (AT/RT) with SameSite=Lax; XSRF double-submit
    - Refresh token is read from cookie `bsaas_rt`; body is accepted only when cookie is absent
    - If both cookie and body refresh tokens are provided, the request is rejected (400)
servers:
  - url: https://api.example.com
    description: Production
  - url: http://localhost:3000
    description: Local
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: bsaas_at
  schemas:
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        correlationId:
          type: string
      required: [code, message]
    LoginDto:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
      required: [email, password]
    RefreshDto:
      type: object
      description: Optional body token used only if cookie `bsaas_rt` is absent.
      properties:
        refreshToken:
          type: string
      required: []
    ForgotDto:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required: [email]
    ResetDto:
      type: object
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8
      required: [token, newPassword]
    PasswordChangeDto:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
      required: [currentPassword, newPassword]
    EmailChangeRequestDto:
      type: object
      properties:
        newEmail:
          type: string
          format: email
      required: [newEmail]
    EmailChangeConfirmDto:
      type: object
      properties:
        token:
          type: string
      required: [token]
    EmailVerifyRequestDto:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]
    EmailVerifyConfirmDto:
      type: object
      oneOf:
        - required: [token]
        - required: [email, otp]
      properties:
        token:
          type: string
        email:
          type: string
          format: email
        otp:
          type: string
          pattern: "^[0-9]{6}$"
    TotpLoginDto:
      type: object
      properties:
        tempToken:
          type: string
        totpCode:
          type: string
          pattern: "^[0-9]{6}$"
      required: [tempToken, totpCode]
    PartnerRegistrationCompleteDto:
      type: object
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
      required: [token, password]
    WebauthnRegisterStartDto:
      type: object
      properties:
        username:
          type: string
      required: [username]
    WebauthnAttestationDto:
      type: object
      properties:
        response:
          type: object
      required: [response]
    WebauthnAssertionDto:
      type: object
      properties:
        response:
          type: object
      required: [response]
paths:
  /auth/login:
    post:
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Authenticated
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Too many attempts
          headers:
            Retry-After:
              description: Cooldown in seconds
              schema:
                type: integer
  /auth/refresh:
    post:
      summary: Rotate refresh token and issue new access token
      description: |
        Uses refresh token from cookie `bsaas_rt`. If both cookie and body token are provided, returns 400.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshDto'
      responses:
        '200':
          description: Tokens rotated
        '400':
          description: Validation error (e.g., both cookie and body present)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/logout:
    post:
      summary: Logout current session
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Logged out
  /auth/sessions:
    get:
      summary: List active sessions
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Sessions listed
  /auth/sessions/revoke/{id}:
    post:
      summary: Revoke a specific session
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session revoked
        '401':
          description: Unauthorized or not owner
  /auth/password/forgot:
    post:
      summary: Request password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotDto'
      responses:
        '202':
          description: Accepted
  /auth/password/reset:
    post:
      summary: Reset password using token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetDto'
      responses:
        '200':
          description: Password updated
  /auth/password/change:
    post:
      summary: Change password for authenticated user
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeDto'
      responses:
        '200':
          description: Password changed
  /auth/email/change/request:
    post:
      summary: Request email change
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequestDto'
      responses:
        '202':
          description: Email change requested
  /auth/email/change/confirm:
    post:
      summary: Confirm email change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeConfirmDto'
      responses:
        '200':
          description: Email changed
  /auth/email/verify/request:
    post:
      summary: Request email verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerifyRequestDto'
      responses:
        '202':
          description: Verification email sent
  /auth/email/verify/confirm:
    post:
      summary: Confirm email verification (OTP or token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerifyConfirmDto'
      responses:
        '200':
          description: Email verified
  /auth/login/totp:
    post:
      summary: Complete TOTP login challenge with temp token and code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpLoginDto'
      responses:
        '200':
          description: Tokens issued
  /auth/recovery/generate:
    post:
      summary: Generate recovery codes
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Recovery codes generated
  /auth/recovery/verify:
    post:
      summary: Verify and consume a recovery code
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Recovery code accepted
        '400':
          description: Invalid code
  /auth/webauthn/register/start:
    post:
      summary: Start WebAuthn registration
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebauthnRegisterStartDto'
      responses:
        '200':
          description: Options returned
  /auth/webauthn/register/finish:
    post:
      summary: Finish WebAuthn registration
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebauthnAttestationDto'
      responses:
        '200':
          description: Registered
  /auth/webauthn/login/start:
    post:
      summary: Start WebAuthn login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                userId:
                  type: string
      responses:
        '200':
          description: Options returned
  /auth/webauthn/login/finish:
    post:
      summary: Finish WebAuthn login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebauthnAssertionDto'
      responses:
        '200':
          description: Tokens issued
  /auth/oauth/{provider}/start:
    get:
      summary: Begin OAuth login for provider
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to provider
  /auth/oauth/{provider}/callback:
    get:
      summary: OAuth callback
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
        - in: query
          name: code
          required: true
          schema:
            type: string
        - in: query
          name: state
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Signed in or linked
  /auth/oauth/{provider}/unlink:
    post:
      summary: Unlink OAuth provider from current user
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Unlinked
  /auth/owner/registration/{token}:
    get:
      summary: Validate owner registration token
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Valid token
  /auth/owner/registration/complete:
    post:
      summary: Complete owner registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerRegistrationCompleteDto'
      responses:
        '201':
          description: Completed
  /auth/staff/registration/{token}:
    get:
      summary: Validate staff registration token
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Valid token
  /auth/staff/registration/complete:
    post:
      summary: Complete staff registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerRegistrationCompleteDto'
      responses:
        '201':
          description: Completed
