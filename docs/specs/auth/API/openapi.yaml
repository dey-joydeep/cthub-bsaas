openapi: 3.1.0
info:
  title: CTHub Auth API
  version: "1.0.0"
  description: >
    Consolidated, implementation-aligned spec for Auth. Generated 2025-09-11.
    Cookies (AT/RT) with SameSite=Lax; XSRF double-submit; uniform anti-enumeration responses.
servers:
  - url: https://api.example.com
    description: Production
  - url: http://localhost:3000
    description: Local
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
  schemas:
    ApiError:
      type: object
      properties:
        code: {"type":"string"}
        message: {"type":"string"}
        correlationId: {"type":"string"}
      required: [code, message]
    LoginDto:
      type: object
      properties:
        email: {"type":"string","format":"email","maxLength":254}
        password: {"type":"string","minLength":8}
      required: [email, password]
    ResetDto:
      type: object
      properties:
        token: {"type":"string"}
        newPassword: {"type":"string","minLength":8}
      required: [token, newPassword]
    ForgotDto:
      type: object
      properties:
        email: {"type":"string","format":"email","maxLength":254}
      required: [email]
    TotpVerifyDto:
      type: object
      properties:
        code: {"type":"string","pattern":"^[0-9]6$"}
      required: [code]
    RegisterStartDto:
      type: object
      properties:
        email: {"type":"string","format":"email"}
      required: [email]
    EmailVerifyRequestDto:
      type: object
      properties:
        email: {"type":"string"}
      required: [email]
    EmailVerifyConfirmDto:
      type: object
      properties:
        sessionId: {"type":"string"}
        email: {"type":"string"}
        code: {"type":"string"}
      required: [sessionId, email, code]
    RegisterCompleteDto:
      type: object
      properties:
        sessionId: {"type":"string"}
        fullName: {"type":"string"}
        password: {"type":"string","minLength":8}
      required: [sessionId, fullName, password]
    PasswordChangeDto:
      type: object
      properties:
        currentPassword: {"type":"string"}
        newPassword: {"type":"string","minLength":8}
      required: [currentPassword, newPassword]
