openapi: 3.1.0
info:
  title: CTHub Auth API
  version: '1.0.0'
  description: |
    Implementation-aligned Auth API.
    - Cookies (AT/RT) with SameSite=Lax; XSRF double-submit
    - Refresh token is read from cookie `bsaas_rt`; body is accepted only when cookie is absent
    - If both cookie and body refresh tokens are provided, the request is rejected (400)
    - Success responses are wrapped by `{ success: true, data, meta?: { correlationId } }`.
    - Error responses are wrapped by `{ success: false, code, message, details?, meta?: { correlationId } }`.
servers:
  - url: https://api.example.com
    description: Production
  - url: http://localhost:3000
    description: Local
security: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: bsaas_at
  schemas:
    ApiError:
      type: object
      properties:
        success:
          type: boolean
          const: false
        code:
          type: string
          description: Stable error code identifier
          example: error.auth.invalid_credentials
        message:
          type: string
          description: i18n message key (client maps to localized string)
          example: error.auth.invalid_credentials
        details:
          description: Optional structured error details
          type: object
        meta:
          type: object
          properties:
            correlationId:
              type: string
      required: [success, code, message]
    LoginDto:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
      required: [email, password]
    RefreshDto:
      type: object
      description: Optional body token used only if cookie `bsaas_rt` is absent.
      properties:
        refreshToken:
          type: string
      required: []
    ForgotDto:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required: [email]
    ResetDto:
      type: object
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8
      required: [token, newPassword]
    PasswordChangeDto:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
      required: [currentPassword, newPassword]
    EmailChangeRequestDto:
      type: object
      properties:
        newEmail:
          type: string
          format: email
      required: [newEmail]
    EmailChangeConfirmDto:
      type: object
      properties:
        token:
          type: string
      required: [token]
    EmailVerifyRequestDto:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]
    EmailVerifyConfirmDto:
      type: object
      oneOf:
        - required: [token]
        - required: [email, otp]
      properties:
        token:
          type: string
        email:
          type: string
          format: email
        otp:
          type: string
          pattern: '^[0-9]{6}$'
    TotpLoginDto:
      type: object
      properties:
        tempToken:
          type: string
        totpCode:
          type: string
          pattern: '^[0-9]{6}$'
      required: [tempToken, totpCode]
    PartnerRegistrationCompleteDto:
      type: object
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
      required: [token, password]
    WebauthnRegisterStartDto:
      type: object
      properties:
        username:
          type: string
      required: [username]
    WebauthnAttestationDto:
      type: object
      properties:
        response:
          type: object
      required: [response]
    WebauthnAssertionDto:
      type: object
      properties:
        response:
          type: object
      required: [response]
    PasskeyDto:
      type: object
      properties:
        credentialId:
          type: string
          description: WebAuthn credential ID (base64url)
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        transports:
          type: array
          items:
            type: string
      required: [credentialId]
paths:
  /auth/login:
    post:
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Authenticated
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Too many attempts
          headers:
            Retry-After:
              description: Cooldown in seconds
              schema:
                type: integer
  /auth/refresh:
    post:
      summary: Rotate refresh token and issue new access token
      description: |
        Uses refresh token from cookie `bsaas_rt`. If both cookie and body token are provided, returns 400.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshDto'
      responses:
        '200':
          description: Tokens rotated
        '400':
          description: Validation error (e.g., both cookie and body present)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/logout:
    post:
      summary: Logout current session
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Logged out
  /auth/sessions:
    get:
      summary: List active sessions
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Sessions listed
  /auth/sessions/revoke/{id}:
    post:
      summary: Revoke a specific session
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session revoked
        '401':
          description: Unauthorized or not owner
  /auth/password/forgot:
    post:
      summary: Request password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotDto'
      responses:
        '202':
          description: Accepted
  /auth/password/reset:
    post:
      summary: Reset password using token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetDto'
      responses:
        '200':
          description: Password updated
  /auth/password/change:
    post:
      summary: Change password for authenticated user
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeDto'
      responses:
        '200':
          description: Password changed
        '401':
          description: Unauthorized
        '403':
          description: CSRF failed
        '429':
          description: Too many attempts
  /auth/email/change/request:
    post:
      summary: Request email change
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequestDto'
      responses:
        '202':
          description: Email change requested
        '401':
          description: Unauthorized
        '403':
          description: CSRF failed
        '429':
          description: Throttled
  /auth/email/change/confirm:
    post:
      summary: Confirm email change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeConfirmDto'
      responses:
        '200':
          description: Email changed
        '400':
          description: Invalid token
        '410':
          description: Token expired
        '422':
          description: Validation failed
        '429':
          description: Throttled
  /auth/email/verify/request:
    post:
      summary: Request email verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerifyRequestDto'
      responses:
        '202':
          description: Verification email sent
        '429':
          description: Throttled
  /auth/email/verify/confirm:
    post:
      summary: Confirm email verification (OTP or token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerifyConfirmDto'
      responses:
        '200':
          description: Email verified
        '400':
          description: Invalid request
        '410':
          description: Token expired
        '422':
          description: Invalid OTP/assertion
        '429':
          description: Throttled
  /auth/login/totp:
    post:
      summary: Complete TOTP login challenge with temp token and code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpLoginDto'
      responses:
        '200':
          description: Tokens issued
        '410':
          description: Challenge expired
        '422':
          description: Invalid TOTP
        '429':
          description: Too many attempts
  /auth/recovery/generate:
    post:
      summary: Generate recovery codes
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Recovery codes generated
        '401':
          description: Unauthorized
        '403':
          description: CSRF failed
  /auth/recovery/verify:
    post:
      summary: Verify and consume a recovery code
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Recovery code accepted
        '400':
          description: Invalid code
        '401':
          description: Unauthorized
        '403':
          description: CSRF failed
        '422':
          description: Validation failed
  /auth/webauthn/register/start:
    post:
      summary: Start WebAuthn registration
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebauthnRegisterStartDto'
      responses:
        '200':
          description: Options returned
        '401':
          description: Unauthorized
        '403':
          description: CSRF failed
  /auth/webauthn/register/finish:
    post:
      summary: Finish WebAuthn registration
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebauthnAttestationDto'
      responses:
        '200':
          description: Registered
        '401':
          description: Unauthorized
        '403':
          description: CSRF failed
        '422':
          description: Invalid attestation
        '410':
          description: Challenge expired
  /auth/webauthn/login/start:
    post:
      summary: Start WebAuthn login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                userId:
                  type: string
      responses:
        '200':
          description: Options returned
        '400':
          description: Invalid request
        '429':
          description: Throttled
  /auth/webauthn/login/finish:
    post:
      summary: Finish WebAuthn login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebauthnAssertionDto'
      responses:
        '200':
          description: Tokens issued
        '401':
          description: Unauthorized
        '422':
          description: Invalid assertion
        '410':
          description: Challenge expired
  /auth/oauth/{provider}/start:
    get:
      summary: Begin OAuth login for provider
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to provider
  /auth/oauth/{provider}/callback:
    get:
      summary: OAuth callback
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
        - in: query
          name: code
          required: true
          schema:
            type: string
        - in: query
          name: state
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Signed in or linked
  /auth/oauth/{provider}/unlink:
    post:
      summary: Unlink OAuth provider from current user
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Unlinked
        '401':
          description: Unauthorized
        '403':
          description: CSRF failed
  /auth/webauthn/devices:
    get:
      summary: List registered passkeys for the current user
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of passkeys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PasskeyDto'
        '401':
          description: Unauthorized
        '403':
          description: CSRF failed
  /auth/webauthn/devices/{id}:
    delete:
      summary: Delete a registered passkey
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '400':
          description: Invalid credential id
        '401':
          description: Unauthorized or not owned
        '403':
          description: CSRF failed
  /auth/owner/registration/{token}:
    get:
      summary: Validate owner registration token
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Valid token
  /auth/owner/registration/complete:
    post:
      summary: Complete owner registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerRegistrationCompleteDto'
      responses:
        '201':
          description: Completed
        '400':
          description: Invalid request
        '410':
          description: Invite expired or consumed
        '422':
          description: Validation failed
  /auth/register:
    post:
      summary: Customer self‑registration (Customer only)
      description: Creates a new Customer account. On success issues cookies and XSRF.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                name:
                  type: string
              required: [email, password, name]
      responses:
        '201':
          description: Registered
        '400':
          description: Invalid request
        '422':
          description: Validation failed
        '429':
          description: Throttled
  /auth/totp/enroll/start:
    post:
      summary: Start TOTP enrollment for current user
      security:
        - cookieAuth: []
      responses:
        '200':
          description: QR code issued
        '401':
          description: Unauthorized
        '403':
          description: CSRF failed
  /auth/totp/enroll/finish:
    post:
      summary: Finish TOTP enrollment by verifying a token
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required: [token]
      responses:
        '200':
          description: TOTP enabled
        '401':
          description: Unauthorized
        '403':
          description: CSRF failed
        '422':
          description: Invalid TOTP
  /auth/staff/registration/{token}:
    get:
      summary: Validate staff registration token
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Valid token
  /auth/staff/registration/complete:
    post:
      summary: Complete staff registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerRegistrationCompleteDto'
      responses:
        '201':
          description: Completed
