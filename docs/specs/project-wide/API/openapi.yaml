openapi: 3.1.0
info:
  title: CTHub Project-Wide Supporting API
  version: '1.0.0'
  description: |
    Target implementation contract for project-wide supporting feature areas not covered by Auth or Salon Owner MVP OpenAPI.
    Auth routes remain defined by docs/specs/auth/API/openapi.yaml.
    Salon Owner operational MVP routes remain defined by docs/specs/salon-owner/API/openapi.yaml.
    All success responses use { success: true, data, meta }.
    All error responses use { success: false, code, message, details?, meta }.
    meta.correlationId is returned on success and error responses.
    Money and decimal values are serialized as strings.
    Timestamps are UTC ISO-8601 strings.
servers:
  - url: https://api.example.com
    description: Production
  - url: http://localhost:3000
    description: Local
tags:
  - name: Shell
  - name: Account Profile
  - name: Customer App
  - name: Public Discovery
  - name: Platform Admin
  - name: Notifications
  - name: Integrations
  - name: Reporting
  - name: Reputation
  - name: Data Privacy
security:
  - cookieAuth: []
paths:
  /shell/context:
    get:
      tags: [Shell]
      operationId: getShellContext
      summary: Get authenticated shell context
      responses:
        '200':
          $ref: '#/components/responses/ObjectSuccess'
  /me/profile:
    get:
      tags: [Account Profile]
      operationId: getMyProfile
      summary: Get current user profile
      responses:
        '200':
          $ref: '#/components/responses/ObjectSuccess'
    patch:
      tags: [Account Profile]
      operationId: updateMyProfile
      summary: Update current user profile
      requestBody:
        $ref: '#/components/requestBodies/ObjectBody'
      responses:
        '200':
          $ref: '#/components/responses/ObjectSuccess'
        '422':
