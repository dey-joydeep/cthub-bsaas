components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: bsaas_at
  parameters:
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IdPath:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ProviderPath:
      name: provider
      in: path
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 64
        pattern: '^[a-z0-9][a-z0-9_-]*$'
    SlugPath:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 120
        pattern: '^[a-z0-9][a-z0-9-]*$'
    TargetTypePath:
      name: targetType
      in: path
      required: true
      schema:
        type: string
        enum: [salon, service, staff]
    TargetIdPath:
      name: targetId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    KeyPath:
      name: key
      in: path
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 120
        pattern: '^[a-z0-9][a-z0-9._-]*$'
    BusinessIdQuery:
      name: businessId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Uuid'
    BranchIdQuery:
      name: branchId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Uuid'
    SearchQuery:
      name: q
      in: query
      required: false
      schema:
        type: string
        minLength: 2
        maxLength: 120
    CursorQuery:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 512
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    FromQuery:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    ToQuery:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
  requestBodies:
    ObjectBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandPayload'
  responses:
    ObjectSuccess:
      description: Successful response with object payload.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ObjectSuccessResponse'
    ListSuccess:
      description: Successful response with list payload.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListSuccessResponse'
    Error:
      description: Error response.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  headers:
    CorrelationId:
      schema:
        type: string
        minLength: 8
        maxLength: 128
  schemas:
    Uuid:
      type: string
      format: uuid
    IsoDateTime:
      type: string
      format: date-time
    MoneyString:
      type: string
      pattern: '^-?\d+\.\d{2}$'
    CommandPayload:
      type: object
      minProperties: 1
      additionalProperties: true
      description: Operation-specific command payload. Field rules are defined in each feature LLD and validation spec before implementation.
    ObjectData:
      type: object
      additionalProperties: true
      description: Operation-specific DTO payload. DTO fields are implemented from the linked feature LLD, validation spec, and endpoint map.
    ListData:
      type: array
      items:
        $ref: '#/components/schemas/ObjectData'
    ResponseMeta:
      type: object
      required: [correlationId]
      properties:
        correlationId:
          type: string
          minLength: 8
          maxLength: 128
    PageMeta:
      type: object
      required: [limit, hasMore]
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean
    ObjectSuccessResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/ObjectData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListSuccessResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/ListData'
        meta:
          allOf:
            - $ref: '#/components/schemas/ResponseMeta'
            - type: object
              required: [page]
              properties:
                page:
                  $ref: '#/components/schemas/PageMeta'
    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
    ErrorResponse:
      type: object
      required: [success, code, message, meta]
      properties:
        success:
          type: boolean
          const: false
        code:
          type: string
          minLength: 3
          maxLength: 160
        message:
          type: string
          minLength: 1
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
