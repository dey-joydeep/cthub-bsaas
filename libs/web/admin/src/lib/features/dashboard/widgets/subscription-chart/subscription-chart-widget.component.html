<div class="chart-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title><ng-container i18n="@@DASHBOARD.SUBSCRIPTIONS.TITLE">Subscriptions Overview</ng-container></mat-card-title>

      <div class="chart-actions" mat-card-actions>
        <button mat-icon-button (click)="refreshChart()" matTooltip="Refresh" i18n-matTooltip="@@COMMON.REFRESH">
          <mat-icon>refresh</mat-icon>
        </button>
      </div>
    </mat-card-header>

    <mat-card-content>
      <!-- Loading state -->
      @if (loading) {
        <div class="loading-state">
          <mat-spinner diameter="40"></mat-spinner>
          <span><ng-container i18n="@@DASHBOARD.LOADING">Loading dashboard...</ng-container></span>
        </div>
      }

      <!-- Error state -->
      @if (error && !loading) {
        <div class="error-state">
          <mat-icon color="warn">error_outline</mat-icon>
          <span>{{ error }}</span>
          <button mat-button color="primary" (click)="refreshChart()" class="retry-button">
            <mat-icon>refresh</mat-icon>
            <ng-container i18n="@@COMMON.RETRY">Retry</ng-container>
          </button>
        </div>
      }

      <!-- Chart container -->
      @if (!loading && !error) {
        <div class="chart-wrapper">
          <div class="chart-canvas-container">
            <canvas baseChart [type]="lineChartType" [data]="lineChartData" [options]="lineChartOptions"> </canvas>
          </div>
          <!-- No data message -->
          @if (!subscriptionData().length) {
            <div class="no-data">
              <mat-icon>info</mat-icon>
              <span><ng-container i18n="@@DASHBOARD.SUBSCRIPTIONS.NO_DATA">No subscription data available.</ng-container></span>
            </div>
          }
        </div>
      }
    </mat-card-content>
  </mat-card>
</div>
