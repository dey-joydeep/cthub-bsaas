<div class="chart-widget">
  <h3>Product Sales</h3>
  @if (!loading() && !error()) {
    <canvas baseChart [data]="data()" [options]="options" chartType="bar"> </canvas>
  }
  @if (loading()) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }
  @if (error()) {
    <mat-error>{{ error() }}</mat-error>
  }
</div>
