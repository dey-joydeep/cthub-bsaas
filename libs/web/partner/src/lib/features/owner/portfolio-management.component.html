<div class="portfolio-management-container">
  <form [formGroup]="portfolioForm" (ngSubmit)="onSubmit()">
    <h1>Portfolio Management</h1>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Title</mat-label>
      <input matInput formControlName="title" required />
      @if (portfolioForm.get('title')?.invalid) {
        <mat-error>Title required</mat-error>
      }
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <input matInput formControlName="description" required />
      @if (portfolioForm.get('description')?.invalid) {
        <mat-error>Description required</mat-error>
      }
    </mat-form-field>
    <div class="portfolio-image-upload">
      <label>Image:</label>
      <input type="file" (change)="onImageChange($event)" accept="image/*" required />
      @if (imagePreview) {
        <img [src]="imagePreview" class="portfolio-image-preview" />
      }
    </div>
    <button mat-raised-button color="primary" class="full-width" [disabled]="loading">Save Portfolio Item</button>
    @if (loading) {
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }
    @if (error) {
      <mat-error>{{ error }}</mat-error>
    }
    @if (success) {
      <p class="success">{{ success }}</p>
    }
  </form>
</div>
