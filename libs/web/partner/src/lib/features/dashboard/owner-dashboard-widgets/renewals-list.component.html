<div class="renewals-list-widget">
  <h3>Upcoming Renewals</h3>
  @if (!loading() && !error()) {
    @if (renewals().length > 0) {
      <mat-list>
        @for (renewal of renewals(); track renewal) {
          <mat-list-item>
            <span matListItemTitle>{{ renewal.salonName }}</span>
            <span matListItemLine>{{ renewal.renewalDate | date: 'mediumDate' }}</span>
          </mat-list-item>
        }
      </mat-list>
    } @else {
      <div>No upcoming renewals.</div>
    }
  }
  @if (loading()) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }
  @if (error()) {
    <mat-error>{{ error() }}</mat-error>
  }
</div>
