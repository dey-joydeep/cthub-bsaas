<div class="customer-stats-widget">
  <h3>Customers</h3>
  @if (!loading() && !error()) {
    <div>
      <div>Active: {{ active() }}</div>
      <div>Passive: {{ passive() }}</div>
    </div>
  }
  @if (loading()) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }
  @if (error()) {
    <mat-error>{{ error() }}</mat-error>
  }
</div>
