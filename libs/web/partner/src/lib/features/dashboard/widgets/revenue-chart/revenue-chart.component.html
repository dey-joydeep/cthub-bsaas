<mat-card class="revenue-chart">
  <mat-card-header>
    <mat-card-title><ng-container i18n="@@DASHBOARD.REVENUE.TITLE">Revenue Analytics</ng-container></mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="chart-container">
      <!-- Chart will be rendered here -->
      @if (!revenueData() || revenueData().length === 0) {
        <div class="no-data">
          <ng-container i18n="@@DASHBOARD.REVENUE.NO_DATA">No revenue data available.</ng-container>
        </div>
      }
    </div>
  </mat-card-content>
</mat-card>
