# SonarQube Server Configuration
sonar.host.url=http://localhost:9000
sonar.projectKey=cthub-bsaas
sonar.projectName=cthub-bsaas
sonar.sourceEncoding=UTF-8

# Source & Test Directories
sonar.sources=apps,libs
sonar.tests=apps,libs

# Test File Inclusions
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/test-setup.ts,**/jest.setup.ts,**/e2e/**

# Exclusions (Build outputs, dependencies, configs, generated files, and tests from source metrics)
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.nx/**,**/.angular/**,**/generated/**,**/*.d.ts,**/*.spec.ts,**/*.test.ts,**/test-setup.ts,**/jest.setup.ts,**/jest.config.*,**/vite.config.*,**/playwright.config.*,**/eslint.config.*,**/postcss.config.*,**/tailwind.config.*,**/e2e/**

# Code Coverage Reports (LCOV)
sonar.javascript.lcov.reportPaths=coverage/apps/api/lcov.info,coverage/apps/web/admin/lcov.info,coverage/apps/web/customer/lcov.info,coverage/apps/web/partner/lcov.info,coverage/libs/server/contracts-auth/lcov.info,coverage/libs/server/contracts-platform/lcov.info,coverage/libs/server/core/lcov.info,coverage/libs/server/data-access/lcov.info,coverage/libs/server/features/lcov.info,coverage/libs/server/features/auth/lcov.info,coverage/libs/server/features/salon-owner/lcov.info,coverage/libs/server/infrastructure/lcov.info,coverage/libs/shared/lcov.info,coverage/libs/web/admin/lcov.info,coverage/libs/web/config/lcov.info,coverage/libs/web/core/auth/lcov.info,coverage/libs/web/core/common/lcov.info,coverage/libs/web/core/http/lcov.info,coverage/libs/web/core/platform/lcov.info,coverage/libs/web/core/testing/lcov.info,coverage/libs/web/customer/lcov.info,coverage/libs/web/partner/lcov.info,coverage/libs/web/public/lcov.info,coverage/libs/web/ui/lcov.info

