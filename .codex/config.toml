[features]
multi_agent = true

[agents.ci-monitor-subagent]
description = "CI helper for /monitor-ci. Fetches CI status, retrieves fix details, or updates self-healing fixes. Executes one MCP tool call and returns the result."
config_file = "agents/ci-monitor-subagent.toml"

[agents.architect-reviewer]
description = "Architecture reviewer for Nx boundaries, backend/frontend layering, implementation slicing, and broad refactor risk. Use for AIDD planning, PR review, and merge-readiness checks."
config_file = "agents/architect-reviewer.toml"

[agents.api-contract-reviewer]
description = "API contract reviewer for OpenAPI, endpoint maps, DTO/schema alignment, response envelopes, auth, validation, and error contracts."
config_file = "agents/api-contract-reviewer.toml"

[agents.security-reviewer]
description = "Security reviewer for auth, authorization, scope isolation, CSRF, cookies, sessions, tokens, validation, sensitive logging, and frontend storage risks."
config_file = "agents/security-reviewer.toml"

[agents.security-adversarial-reviewer]
description = "Independent attack-path reviewer for critical security, tenant isolation, identity, and financial decisions. Use alongside security-reviewer, with a separate question and evidence review."
config_file = "agents/security-adversarial-reviewer.toml"

[agents.product-spec-reviewer]
description = "Independent product specification reviewer for critical salon workflows, business rules, acceptance criteria, and MVP scope."
config_file = "agents/product-spec-reviewer.toml"

[agents.test-reviewer]
description = "Test reviewer for unit, integration, contract, e2e, regression, permission, validation, conflict, and edge-case coverage."
config_file = "agents/test-reviewer.toml"

[agents.angular-ssr-reviewer]
description = "Frontend reviewer for Angular 21, SSR safety, Material v3, Tailwind v4 twc- prefix usage, accessibility, web state handling, and web tests."
config_file = "agents/angular-ssr-reviewer.toml"

[agents.nestjs-prisma-reviewer]
description = "Backend reviewer for NestJS 11, Prisma, repository boundaries, DTO validation, response envelopes, i18n/error codes, and server tests."
config_file = "agents/nestjs-prisma-reviewer.toml"

[agents.database-reviewer]
description = "Database reviewer for schema architecture, migrations, test isolation, data access, and recovery evidence."
config_file = "agents/database-reviewer.toml"

[agents.docs-traceability-reviewer]
description = "Documentation traceability reviewer for user story to FRD/FNRD/HLD/LLD/API/VALIDATION/WEB/TEST alignment and visual artifact source-of-truth rules."
config_file = "agents/docs-traceability-reviewer.toml"

[agents.implementation-planner]
description = "Planning helper for implementation slices, impacted projects, validation, and rollout risk."
config_file = "agents/implementation-planner.toml"

[agents.backend-implementer]
description = "Backend implementation helper for approved NestJS and Prisma work within existing specs and boundaries."
config_file = "agents/backend-implementer.toml"

[agents.frontend-implementer]
description = "Frontend implementation helper for approved Angular work within existing specs and SSR constraints."
config_file = "agents/frontend-implementer.toml"

[agents.docs-contract-updater]
description = "Docs and contract updater for aligned FRD/HLD/LLD/API/validation/test changes when implementation shifts behavior."
config_file = "agents/docs-contract-updater.toml"

[profiles.workspace_write]
approval_policy = "on-request"
sandbox_mode    = "workspace-write"

[profiles.readonly_quiet]
approval_policy = "never"
sandbox_mode    = "read-only"
