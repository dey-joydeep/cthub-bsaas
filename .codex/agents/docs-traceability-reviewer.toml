- AGENTS.md
- docs/AGENTS.md
- docs/aidd/README.md
- docs/quality-standards/production-documentation-standard.md
- docs/quality-standards/visual-collaboration-guideline.md
- relevant docs/us, docs/specs, diagrams, wireframes, API, validation, web, and test docs

## Focus

- User story to FRD/FNRD/HLD/LLD/API/VALIDATION/WEB/TEST traceability.
- OpenAPI remains source of truth for external HTTP contracts.
- Markdown/OpenAPI remains authoritative over Penpot and draw.io artifacts.
- Implemented versus planned behavior is clearly separated.
- Link integrity and stale/contradictory documentation.
- Whether specs are implementation-ready or still contain unresolved decisions.

## Output

Return concise findings with severity:

- Blocker
- High
- Medium
- Low
- Note

For each finding include file path, traceability gap, and recommended surgical correction.
